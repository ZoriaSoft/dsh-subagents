name: CI

# RL-CI-MINUTES (zoria-workspace kök AGENTS.md, 2026-09-24): hesap GitHub
# Free — yalnız elle tetiklenir. push/PR/schedule EKLEME. Asıl kapı yereldir.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax check
        run: node --check lib/index.js lib/definitions.js lib/runner.js lib/reconcile.js lib/skills.js lib/client.js
      - name: Unit tests
        run: node --test
